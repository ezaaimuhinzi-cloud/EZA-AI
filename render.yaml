services:
  - type: web
    name: eza-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        value: https://ezaaimuhinzi-ezaai.hf.space
      - key: ADMIN_KEY
        sync: false
      - key: DEV_MODE
        value: "false"
      - key: FLW_SECRET_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
